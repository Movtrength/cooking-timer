<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>요리 레시피</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1c1f23;--muted:#67707b;--accent:#0b7a55;--accent-soft:#e2f2eb;--border:#e2e6ea;--warn-bg:#fdf1cf;--warn-tx:#7a5400;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#141619;--card:#1e2126;--text:#e9ecef;--muted:#9aa3ae;--accent:#3fcd9a;--accent-soft:#163429;--border:#2c3138;--warn-bg:#342a10;--warn-tx:#ffd670}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;line-height:1.6;padding-bottom:76px}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--border)}
.brand{font-weight:700;font-size:15px}
button{font:inherit;color:inherit}
.back-btn{border:1px solid var(--border);background:var(--bg);border-radius:8px;padding:6px 12px;font-size:14px;cursor:pointer}
.hide{display:none!important}
.filters{max-width:780px;margin:0 auto;padding:14px 14px 0}
#search{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);font:inherit;font-size:14px}
#search:focus,.fsel:focus{outline:2px solid var(--accent);outline-offset:-1px}
.fgroup{margin-top:12px}
.flabel{display:block;margin:0;font-size:12px;font-weight:700;color:var(--muted)}
.fsel{display:block;width:100%;margin-top:4px;padding:9px 12px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);font:inherit;font-size:14px;font-weight:400}
.msel{position:relative}
.msel-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;cursor:pointer}
.msel-sum{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;font-weight:400}
.msel-caret{flex:0 0 auto;color:var(--muted);font-size:11px;line-height:1}
.msel-panel{position:absolute;z-index:8;left:0;right:0;top:calc(100% + 4px);max-height:min(240px,46vh);overflow:auto;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:4px;box-shadow:0 8px 24px color-mix(in srgb, var(--text) 16%, transparent)}
.msel-item{display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer}
.msel-item input{width:18px;height:18px;margin:0;flex:0 0 auto;accent-color:var(--accent)}
.fhint{margin:4px 0 0;font-size:12px;color:var(--muted)}
.check{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px;font-weight:600}
.check input{width:18px;height:18px;margin:0}
#count{font-size:13px;color:var(--muted);margin:10px 0 0}
#empty:empty{display:none}
.recipe{max-width:660px;margin:0 auto;padding:16px 16px 0}

.meta{font-size:13px;color:var(--muted);margin-top:3px}
.src{margin:8px 0 0;font-size:14px}
.src a{color:var(--accent)}
.thumb{display:block;margin:0 0 14px;border-radius:12px;overflow:hidden;border:1px solid var(--border);background:var(--card);text-decoration:none}
.thumb img{display:block;width:100%;height:220px;object-fit:cover;background:color-mix(in srgb, var(--muted) 14%, var(--card))}
.thumb-empty{display:flex;align-items:center;justify-content:center;height:160px;margin:0 0 14px;border-radius:12px;border:1px dashed var(--border);background:color-mix(in srgb, var(--muted) 10%, var(--card));color:var(--muted);font-size:13px;font-weight:650}
.scale-row{display:flex;gap:8px;margin:16px 0 4px}
.scale-btn{flex:1;padding:8px 0;border:1px solid var(--border);border-radius:10px;background:var(--card);cursor:pointer}
.scale-btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.sec{margin:22px 0 0}
.sec-h{margin:0 0 8px;font-size:13px;letter-spacing:.04em;color:var(--muted);font-weight:700}
table.ing{width:100%;border-collapse:collapse;font-size:14px}
.ing th{text-align:left;font-weight:600;font-size:12px;color:var(--muted);border-bottom:1px solid var(--border);padding:4px 8px 4px 0}
.ing td{border-bottom:1px solid var(--border);padding:7px 8px 7px 0;vertical-align:top}
.ing td.note{color:var(--muted);font-size:13px}
ul.list{margin:0;padding-left:18px;font-size:14px}
ul.list li{margin:4px 0}
.sub-item{font-size:14px;margin:7px 0}
.sub-item .memo{color:var(--muted);font-size:13px}
.step{display:flex;gap:10px;margin:14px 0;padding-bottom:14px;border-bottom:1px dashed var(--border)}
.step:last-child{border-bottom:0;padding-bottom:0}
.step-n{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.step-body{flex:1;min-width:0}
.step-tx{font-size:15px;white-space:pre-wrap}
.timer-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:9px}
.tbtn{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:5px 14px;font-size:13px;cursor:pointer}
.tnote{font-size:12px;color:var(--muted)}
details.info{border:1px solid var(--border);border-radius:10px;background:var(--card);padding:0 12px;margin:14px 0 0}
details.info summary{cursor:pointer;font-weight:650;font-size:14px;padding:10px 0}
details.info pre{white-space:pre-wrap;word-break:break-word;font-size:13px;color:var(--muted);margin:0 0 12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
#tbar{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--border);overflow-x:auto}
.tchip{display:flex;align-items:center;gap:8px;background:var(--accent-soft);border-radius:999px;padding:6px 8px 6px 14px;flex:0 0 auto}
.tlabel{font-size:12px;font-weight:600;color:var(--accent);max-width:36vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ttime{font-size:14px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.tcancel{border:0;background:transparent;color:var(--accent);cursor:pointer;padding:2px 6px;font-size:14px}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(8px);background:#111;color:#fff;padding:9px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:20;max-width:86vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>

    const willOpen = panel.classList.contains("hide");
    closeMultis(willOpen ? wrap : null);
    panel.classList.toggle("hide", !willOpen);
    btn.setAttribute("aria-expanded", willOpen ? "true" : "false");
  });
  wrap.appendChild(btn);
  wrap.appendChild(panel);
  row.appendChild(lab);
  row.appendChild(wrap);
  row.appendChild(el("p", "fhint", "여러 개를 고르면 고른 항목이 모두 있는 요리만 남습니다."));
  parent.appendChild(row);
}
function option(value, text) {
  const o = el("option", null, text);
  o.value = value;
  return o;
}
function addDropdown(parent, title, id, labels, selected, onPick) {
  const row = el("div", "fgroup");
  const lab = el("label", "flabel", title);
  lab.htmlFor = id;
  const sel = document.createElement("select");
  sel.id = id;
  sel.className = "fsel";
  sel.setAttribute("aria-label", title);
  sel.appendChild(option("전체", "전체"));
  (labels || []).forEach(name => sel.appendChild(option(name, name)));
  const known = selected === "전체" || (labels || []).indexOf(selected) !== -1;
  sel.value = known ? selected : "전체";
  sel.addEventListener("change", () => onPick(sel.value));
  row.appendChild(lab);
  row.appendChild(sel);
  parent.appendChild(row);
  return sel;
}
function activeFlag(flags) {
  for (let i = 0; i < flags.length; i++) if (flagOn[flags[i]]) return flags[i];
  return "전체";
}
function buildFacets() {
  const host = $("facetBox");
  if (!host) return;
  host.textContent = "";
  const courses = [];
  RECIPES.forEach(r => { const c = r.course || ""; if (c && courses.indexOf(c) === -1) courses.push(c); });
  addDropdown(host, "코스", "coursePick", courses, courseSel, v => { courseSel = v; renderMenu(); });
  if (FACETS) {
    addDropdown(host, "음식 카테고리", "catPick", FACETS.category, catSel, v => { catSel = v; renderMenu(); });
    addMulti(host, "소스", "saucePick", FACETS.sauces, sauceSel);
    addMulti(host, "식재료", "ingPick", FACETS.ingredients, ingSel);
    const flags = FACETS.flags || [];
    if (flags.length) {
      const row = el("div", "fgroup");
      const lab = el("label", "flabel", "조건");
      lab.htmlFor = "flagPick";
      const sel = document.createElement("select");
      sel.id = "flagPick";
      sel.className = "fsel";
      sel.setAttribute("aria-label", "조건");
      sel.appendChild(option("전체", "전체"));
      flags.forEach(name => sel.appendChild(option(name, name)));
      sel.value = activeFlag(flags);
      sel.addEventListener("change", () => {
        flags.forEach(name => { flagOn[name] = name === sel.value; });
        renderMenu();
      });
      row.appendChild(lab);
      row.appendChild(sel);
      row.appendChild(el("p", "fhint", "해산물을 고르면 그 요리를 숨깁니다. 다른 조건은 해당 요리만 남깁니다."));
      host.appendChild(row);
    }
  }
  const draft = el("label", "check");
  const inp = document.createElement("input");
  inp.type = "checkbox";
  inp.id = "hideDraft";
  inp.checked = hideDraft;
  inp.setAttribute("aria-label", "초안 숨기기");
  inp.addEventListener("change", () => { hideDraft = inp.checked; renderMenu(); });
  draft.appendChild(inp);
  draft.appendChild(document.createTextNode("초안 숨기기"));
  host.appendChild(draft);
}
function showRecipe(on) {
  $("recipeView").classList.toggle("hide", !on);
  $("backBtn").classList.toggle("hide", !on);
}
function renderMenu() {
  if (!$("facetBox").childElementCount) buildFacets();
  const sel = $("recipePick");
  const empty = $("empty");
  sel.textContent = "";
  if (!RECIPES.length) {
    $("count").textContent = "0개 중 0개";
    empty.textContent = "레시피가 없습니다.";
    cur = -1;
    showRecipe(false);
    return;
  }
  const vis = [];
  RECIPES.forEach((r, i) => { if (matches(r)) vis.push(i); });
  $("count").textContent = RECIPES.length + "개 중 " + vis.length + "개";
  empty.textContent = vis.length ? "" : "일치하는 레시피가 없습니다.";
  sel.appendChild(option("", vis.length ? "레시피를 고르세요" : "일치하는 레시피 없음"));
  vis.forEach(i => sel.appendChild(option(String(i), RECIPES[i].title)));
  if (cur >= 0 && vis.indexOf(cur) === -1) {
    cur = -1;
    scale = null;
    $("rbody").textContent = "";
  }
  sel.value = cur >= 0 ? String(cur) : "";
  showRecipe(cur >= 0);
}
function openRecipe(i) {
  cur = i;
  scale = null;
  renderRecipe();
  showRecipe(true);
  const sel = $("recipePick");
  if (sel) sel.value = String(i);
}

function placeholderThumb() {
  const d = el("div", "thumb-empty", "완성 사진 없음");
  d.setAttribute("role", "img");
  d.setAttribute("aria-label", "완성 사진 없음");
  return d;
}
function dishThumb(r) {
  const url = r && r.image_url;
  if (!r || !r.image_found || !url || !r.source_url) return placeholderThumb();
  const a = document.createElement("a");
  a.className = "thumb";
  a.href = r.source_url;
  a.target = "_blank";
  a.rel = "noopener noreferrer";
  a.setAttribute("aria-label", (r.title || "레시피") + " 출처 페이지");
  const img = document.createElement("img");
  img.alt = (r.title || "완성 요리") + " 완성 사진";
  img.loading = "lazy";
  img.decoding = "async";
  img.referrerPolicy = "no-referrer";
  img.addEventListener("error", () => {
    const ph = placeholderThumb();
    if (a.parentNode) a.replaceWith(ph);
  });
  img.src = url;
  a.appendChild(img);
  return a;
}
function renderRecipe() {
  const r = RECIPES[cur], v = $("rbody");
  v.textContent = "";
  const f = (scale == null || !r.servings) ? 1 : scale / r.servings;

  v.appendChild(dishThumb(r));
  const h = el("header");
  h.appendChild(el("h1", "r-title", r.title));
  h.appendChild(el("div", "meta", fmt1(r.total_min) + "분 · " + fmt1(r.servings) + "인분" + (r.heat ? " · " + r.heat : "")));
  const al = allergenText(r.allergens);
  if (al) h.appendChild(el("div", "meta", "알레르기: " + al));
  if (r.source_url) {
    const p = el("p", "src", "출처: ");
    const a = el("a", null, r.source_name || r.source_url);
    a.href = r.source_url; a.target = "_blank"; a.rel = "noopener noreferrer";
    p.appendChild(a); h.appendChild(p);
  }
  v.appendChild(h);

  const sr = el("div", "scale-row");
  [[1, "1인분"], [2, "2인분"], [null, "원문"]].forEach(o => {
    const b = el("button", "scale-btn" + (scale === o[0] ? " on" : ""), o[1]);
    b.type = "button";
    b.addEventListener("click", () => { scale = o[0]; renderRecipe(); });
    sr.appendChild(b);
  });
  v.appendChild(sr);

  const ing = sec("재료" + (scale != null ? " · " + scale + "인분 기준" : ""));
  const tbl = el("table", "ing"), thead = el("thead"), thr = el("tr");
  ["재료", "양", "비고"].forEach(x => thr.appendChild(el("th", null, x)));
  thead.appendChild(thr); tbl.appendChild(thead);
  const tb = el("tbody");
  (r.ingredients || []).forEach(g => {
    const tr = el("tr");
    tr.appendChild(el("td", "ing-name", g.name));
    tr.appendChild(el("td", "ing-amt", scaledAmount(g.amount, f) + (g.unit ? " " + g.unit : "")));
    tr.appendChild(el("td", "note", g.note || ""));
    tb.appendChild(tr);
  });
  tbl.appendChild(tb); ing.appendChild(tbl); v.appendChild(ing);

  if ((r.mise || []).length) { const s = sec("미장"); s.appendChild(listItems(r.mise)); v.appendChild(s); }
  if ((r.subs || []).length) {
    const s = sec("대체");
    r.subs.forEach(x => {
      const d = el("div", "sub-item", x.from + " → " + (x.to || ""));
      if (x.memo) d.appendChild(el("span", "memo", "(" + x.memo + ")"));
      s.appendChild(d);
    });
    v.appendChild(s);
  }
  if ((r.steps || []).length) {
    const s = sec("조리 순서");
    r.steps.forEach(x => {
      const d = el("div", "step");
      d.appendChild(el("span", "step-n", String(x.n)));
      const body = el("div", "step-body");
      body.appendChild(el("div", "step-tx", x.text));
      (r.timers || []).filter(t => t.step == x.n).forEach(t => {
        const row = el("div", "timer-row");
        if (t.kind === "range" && Array.isArray(t.range) && t.range.length >= 2) {
          [t.range[0], t.range[1]].forEach(m => row.appendChild(tbtn(m, t, x.n)));
        } else if ((t.kind === "fixed" || t.kind === "at_least") && t.minutes != null) {
          row.appendChild(tbtn(t.minutes, t, x.n));
        }
        if (t.note) row.appendChild(el("span", "tnote", t.note));
        if (row.children.length) body.appendChild(row);
      });
      d.appendChild(body);
      s.appendChild(d);
    });
    v.appendChild(s);
  }
  if ((r.cautions || []).length) { const s = sec("주의"); s.appendChild(listItems(r.cautions)); v.appendChild(s); }
  if ((r.done || []).length) { const s = sec("완료 기준"); s.appendChild(listItems(r.done)); v.appendChild(s); }

  if (r.nutrition_md != null) {
    const d = el("details", "info");
    d.appendChild(el("summary", null, "영양 정보"));
    d.appendChild(el("pre", null, r.nutrition_md));
    v.appendChild(d);
  }
  const gd = el("details", "info");
  gd.appendChild(el("summary", null, "계량 가이드"));
  gd.appendChild(listItems(["큰술 = 15ml", "작은술 = 5ml", "꼬집 = 엄지와 검지로 집은 아주 적은 양"]));
  v.appendChild(gd);
}

function tbtn(min, t, n) {
  const b = el("button", "tbtn", fmt1(min) + "분");
  b.type = "button";
  b.addEventListener("click", () => startTimer(min, t, n));
  return b;
}
function startTimer(min, t, n) {
  if (timers.length >= 2) { toast("타이머는 2개까지"); return; }
  const r = RECIPES[cur];
  const short = r.title.length > 6 ? r.title.slice(0, 6) + "…" : r.title;
  timers.push({ label: short + " · " + n + "단계", ends: Date.now() + min * 60000, alert: (t && t.alert) || "타이머가 끝났습니다" });
  if (!tickId) tickId = setInterval(tick, 250);
  renderBar();
}
const mmss = ms => {
  const s = Math.max(0, Math.ceil(ms / 1000));
  return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
};
function renderBar() {
  const bar = $("tbar");
  bar.textContent = "";
  if (!timers.length) {
    bar.classList.add("hide");
    if (tickId) { clearInterval(tickId); tickId = null; }
    return;
  }
  bar.classList.remove("hide");
  timers.forEach(tm => {
    const c = el("div", "tchip");
    c.appendChild(el("span", "tlabel", tm.label));
    tm.timeEl = el("span", "ttime", mmss(tm.ends - Date.now()));
    c.appendChild(tm.timeEl);
    const x = el("button", "tcancel", "✕");
    x.type = "button";
    x.setAttribute("aria-label", "타이머 취소");
    x.addEventListener("click", () => cancelTimer(tm));
    c.appendChild(x);
    bar.appendChild(c);
  });
}
function cancelTimer(tm) {
  timers = timers.filter(x => x !== tm);
  renderBar();
}
function finishTimer(tm) {
  timers = timers.filter(x => x !== tm);
  renderBar();
  toast(tm.alert);
  if (typeof navigator !== "undefined" && navigator.vibrate) navigator.vibrate(200);
  if (audioUnlocked) beep();
}
function tick() {
  const now = Date.now();
  timers.filter(tm => now >= tm.ends).forEach(finishTimer);
  timers.forEach(tm => { if (tm.timeEl) tm.timeEl.textContent = mmss(tm.ends - now); });
}
function toast(m) {
  const t = $("toast");
  t.textContent = m;
  t.classList.add("show");
  if (toastTid) clearTimeout(toastTid);
  toastTid = setTimeout(() => t.classList.remove("show"), 3500);
}
function ensureAudio() {
  try {
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) actx = new AC();
    }
    if (actx && actx.state === "suspended") actx.resume();
  } catch (e) {}
}
function unlockAudio() {
  audioUnlocked = true;
  ensureAudio();
}
function beep() {
  ensureAudio();
  if (!actx) return;
  try {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = "sine"; o.frequency.value = 880;
    o.connect(g); g.connect(actx.destination);
    const t0 = actx.currentTime;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.5, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.7);
    o.start(t0); o.stop(t0 + 0.75);
  } catch (e) {}
}

document.addEventListener("click", e => {
  if (!e.target.closest || !e.target.closest(".msel")) closeMultis(null);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeMultis(null);
});
document.addEventListener("pointerdown", unlockAudio, true);
document.addEventListener("click", unlockAudio, true);
$("backBtn").addEventListener("click", () => {
  cur = -1;
  scale = null;
  $("rbody").textContent = "";
  $("recipePick").value = "";
  showRecipe(false);
  window.scrollTo(0, 0);
});
$("recipePick").addEventListener("change", () => {
  const v = $("recipePick").value;
  if (v === "") {
    cur = -1;
    scale = null;
    $("rbody").textContent = "";
    showRecipe(false);
    return;
  }
  openRecipe(Number(v));
});
$("search").addEventListener("input", e => { query = e.target.value; renderMenu(); });
if (location.search.indexOf("test=1") !== -1) globalThis.__menuTest = { matches };
renderMenu();
})();
